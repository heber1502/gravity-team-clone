<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 80" fill="none">
  <!-- Outer arc (top curve) -->
  <path
    d="M 10 65 Q 150 -10 290 65"
    stroke="#C9A050"
    stroke-width="22"
    stroke-linecap="butt"
    fill="none"
  />
  <!-- Notch teeth cut into the bottom of the arc -->
  <!-- We overlay white rectangles to simulate teeth/notches -->
  <rect x="80"  y="52" width="8"  height="16" fill="#141619"/>
  <rect x="102" y="46" width="8"  height="16" fill="#141619"/>
  <rect x="124" y="42" width="8"  height="16" fill="#141619"/>
  <rect x="146" y="40" width="8"  height="16" fill="#141619"/>
  <rect x="168" y="42" width="8"  height="16" fill="#141619"/>
  <rect x="190" y="46" width="8"  height="16" fill="#141619"/>
  <rect x="212" y="52" width="8"  height="16" fill="#141619"/>
</svg>
